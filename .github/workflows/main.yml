name: Simple CI Pipeline

on: [push]

jobs: 
  create-build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4 
      
      - uses: actions/setup-node@v4
        with: 
         node-version: 22

      - name: "Install Dependencies and Build"
        run: npm i

      - name: "Create Build"
        run: npm run build
  
